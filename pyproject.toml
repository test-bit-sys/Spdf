[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spdf-editor"
version = "1.0.0"
authors = [
  { name = "Spdf Contributors" },
]
description = "A modern, lightweight, high-performance desktop PDF reader, editor, and organizer built with PySide6 and PyMuPDF."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pdf", "pdf-reader", "pdf-editor", "pyside6", "qt", "pymupdf", "annotations", "desktop-app"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Office/Business :: Office Suites",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "PySide6>=6.5.0",
  "PyMuPDF>=1.23.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
spdf = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spdf*"]
